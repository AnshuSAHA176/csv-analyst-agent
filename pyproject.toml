[project]
name = "csv-analyst-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anshu Saha", email = "anshusahaa62@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "adrf>=0.1.14",
    "celery>=5.7.0",
    "cloudinary>=1.47.0",
    "django>=5.2.19",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "duckdb>=2.0.0",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "pandas>=3.1.1",
    "psycopg>=3.3.8",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
]

[project.scripts]
csv-analyst-agent = "csv_analyst_agent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
